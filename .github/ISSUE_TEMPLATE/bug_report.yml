name: Bug Report
description: Report a bug or unexpected behavior
title: '[Bug]: '
labels: ['bug', 'needs-triage']
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to fill out this bug report!

    - type: textarea
      id: description
      attributes:
          label: Bug Description
          description: A clear and concise description of what the bug is
          placeholder: What happened?
      validations:
          required: true

    - type: textarea
      id: reproduction
      attributes:
          label: Steps to Reproduce
          description: Steps to reproduce the behavior
          placeholder: |
              1. Create a model with...
              2. Call method...
              3. See error...
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected Behavior
          description: What you expected to happen
          placeholder: I expected...
      validations:
          required: true

    - type: textarea
      id: actual
      attributes:
          label: Actual Behavior
          description: What actually happened
          placeholder: Instead, I got...
      validations:
          required: true

    - type: textarea
      id: code
      attributes:
          label: Code Sample
          description: Minimal code to reproduce the issue
          render: typescript
          placeholder: |
              @Quick({ createdAt: Date })
              class User extends QModel<IUser> {
                declare createdAt: Date;
              }

    - type: input
      id: version
      attributes:
          label: QuickModel Version
          description: What version of QuickModel are you using?
          placeholder: '1.0.0'
      validations:
          required: true

    - type: dropdown
      id: runtime
      attributes:
          label: Runtime
          description: What runtime are you using?
          options:
              - Node.js
              - Bun
              - Deno
              - Browser
              - Other
      validations:
          required: true

    - type: input
      id: typescript
      attributes:
          label: TypeScript Version
          placeholder: '5.0.0'

    - type: textarea
      id: additional
      attributes:
          label: Additional Context
          description: Any other context about the problem
          placeholder: Stack trace, error logs, etc.
