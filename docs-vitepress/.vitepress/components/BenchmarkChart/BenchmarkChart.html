<div class="bm-wrapper">
	<!-- ═══════════════════════════════════════════════════════
	     TAB BAR
	     ═══════════════════════════════════════════════════════ -->
	<TabBar
		:tabs="tabItems"
		:model-value="activeTab"
		@update:model-value="setTab" />

	<!-- ═══════════════════════════════════════════════════════
	     TAB PANELS (animated)
	     ═══════════════════════════════════════════════════════ -->
	<Transition
		:name="'bm-tab-' + tabDirection"
		mode="out-in">
		<div
			:key="activeTab"
			class="bm-tab-panel">
			<!-- ─── PANEL: Feature Comparison ─────────────── -->
			<template v-if="activeTab === 'features'">
				<div class="bm-panel-header">
					<h2 class="bm-header__title">
						🎯 {{ t.benchmark.featureTitle }}
					</h2>
					<p class="bm-header__subtitle">
						{{ t.benchmark.featureSubtitle }}
					</p>
				</div>

				<!-- Feature matrix table -->
				<div class="bm-matrix">
					<div class="bm-matrix__header">
						<h3 class="bm-matrix__title">
							{{ t.benchmark.matrixTitle }}
						</h3>
						<p class="bm-matrix__hint">
							{{ t.benchmark.matrixHint }}
						</p>
					</div>
					<!-- Matrix filters: type selector + library badges -->
					<div class="bm-matrix__filters">
						<div class="bm-matrix__filter-row">
							<span class="bm-matrix__filter-label">
								{{ t.benchmark.typeLabel }}
							</span>
							<div class="bm-matrix__type-pills">
								<button
									v-for="opt in matrixTypeOptions"
									:key="opt.key"
									:class="['bm-matrix__type-pill', { 'bm-matrix__type-pill--active': activeMatrixType === opt.key }]"
									@click="activeMatrixType = opt.key">
									{{ bmt.matrixTypes[opt.key] }}
								</button>
							</div>
						</div>
						<div class="bm-matrix__filter-row">
							<span class="bm-matrix__filter-label">
								{{ t.benchmark.librariesLabel }}
							</span>
							<TransitionGroup
								tag="div"
								class="bm-matrix__badges"
								name="bm-badge">
								<button
									v-for="lib in matrixLibsByType.filter((lib) => lib !== 'QuickModel')"
									:key="lib"
									:class="['bm-matrix__badge', { 'bm-matrix__badge--off': disabledMatrixLibs.includes(lib) }]"
									:style="{ '--badge-color': libraries[lib]?.color }"
									@click="toggleMatrixLib(lib)">
									{{ lib }}
								</button>
							</TransitionGroup>
						</div>
						<div class="bm-matrix__filter-row">
							<span class="bm-matrix__filter-label">
								{{ t.benchmark.featuresLabel }}
							</span>
							<div class="bm-matrix__badges">
								<button
									v-for="cat in featureCategoryOptions.filter((opt) => opt.key !== 'all')"
									:key="cat.key"
									:class="['bm-matrix__badge bm-matrix__badge--cat', { 'bm-matrix__badge--off': disabledFeatureCategories.includes(cat.key) }]"
									@click="toggleFeatureCategory(cat.key)">
									{{ bmt.featureCategories[cat.key] }}
								</button>
							</div>
						</div>
					</div>
					<div class="bm-matrix__scroll">
						<table class="bm-matrix__table">
							<thead>
								<tr>
									<th class="bm-matrix__th-feature">
										Feature
									</th>
									<th
										v-for="lib in visibleMatrixLibNames"
										:key="lib"
										:class="[
											'bm-matrix__th-lib',
											{ 'bm-matrix__th-lib--ours': lib === 'QuickModel' },
											{ 'bm-matrix__th-lib--hidden': isLibHidden(lib) },
										]"
										:style="{ color: libraries[lib]?.color }">
										{{ lib }}
									</th>
								</tr>
							</thead>
							<tbody>
								<tr
									v-for="row in featureRows"
									:key="row.i18nKey"
									:class="{ 'bm-matrix__tr--hidden': isCategoryHidden(row.category) }">
									<td class="bm-matrix__td-feature">
										{{ bmt.features[row.i18nKey].label }}
									</td>
									<td
										v-for="lib in visibleMatrixLibNames"
										:key="lib"
										:class="[
											'bm-matrix__td-check',
											{ 'bm-matrix__td-check--ours': lib === 'QuickModel' },
											{ 'bm-matrix__td-check--hidden': isLibHidden(lib) },
										]">
										<span
											v-if="row.values[lib] === 'partial' && row.notes?.[lib]"
											class="bm-matrix__icon bm-matrix__icon--warning"
											@mouseenter="onWarningMouseEnter(featureNote(row.i18nKey, row.notes[lib]), $event)"
											@mouseleave="onWarningMouseLeave()">
											⚠️
										</span>
										<template v-else>
											{{ featureIcon(row.values[lib]) }}
										</template>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</template>

			<!-- ─── PANEL: Coverage Map ───────────────────── -->
			<template v-else-if="activeTab === 'coverage'">
				<div class="bm-panel-header">
					<h2 class="bm-header__title">
						📊 {{ t.benchmark.coverageTitle }}
					</h2>
					<p class="bm-header__subtitle">
						{{ t.benchmark.coverageSubtitle }}
					</p>
				</div>

				<div class="bm-coverage">
					<div class="bm-coverage__scroll">
						<div
							class="bm-coverage__grid"
							:style="{ '--scn-count': scenarios.length }">
							<!-- Header row -->
							<div
								class="bm-coverage__header-cell bm-coverage__lib-col"></div>
							<div
								v-for="scn in scenarios"
								:key="scn.key"
								class="bm-coverage__header-cell bm-coverage__scn-label">
								{{ bmt.scenarios[scn.key].label }}
							</div>

							<!-- Library rows -->
							<template
								v-for="lib in coverageLibNames"
								:key="lib">
								<div
									:class="['bm-coverage__lib-name', { 'bm-coverage__lib-name--ours': lib === 'QuickModel' }]"
									:style="{
										color: libraries[lib]?.color,
										background: lib === 'QuickModel' ? libraries[lib]?.color + '22' : 'transparent',
										borderRadius: lib === 'QuickModel' ? '8px' : '0',
										padding: lib === 'QuickModel' ? '2px 10px 2px 8px' : '0',
										border: lib === 'QuickModel' ? '1px solid ' + libraries[lib]?.color + '44' : 'none',
									}">
									{{ lib }}
								</div>
								<button
									v-for="scn in scenarios"
									:key="scn.key"
									:class="[
										'bm-coverage__chip',
										scn.values[lib] != null ? 'bm-coverage__chip--on' : 'bm-coverage__chip--off',
										scn.key === activeScenario && scn.values[lib] != null ? 'bm-coverage__chip--active' : '',
									]"
									:style="scn.values[lib] != null ? { '--chip-color': libraries[lib]?.color } : {}"
									:disabled="scn.values[lib] == null"
									:title="scn.values[lib] != null ? bmt.scenarios[scn.key].label + ': ' + formatBadgeSpeed(scn.values[lib]) : ''"
									@click="scn.values[lib] != null && goToScenario(scn.key)">
									<span class="bm-coverage__chip-speed">
										{{
											scn.values[lib] != null
												? formatBadgeSpeed(
														scn.values[lib]
													)
												: '—'
										}}
									</span>
								</button>
							</template>
						</div>
					</div>
				</div>
			</template>

			<!-- ─── PANEL: Performance Benchmark ─────────── -->
			<template v-else>
				<div class="bm-panel-header">
					<h2 class="bm-header__title">
						⚡ {{ t.benchmark.perfTitle }}
					</h2>
					<p class="bm-header__subtitle">
						{{ t.benchmark.perfSubtitle }}
					</p>
				</div>

				<!-- Scenario badges -->
				<div class="bm-scenario-badges">
					<button
						v-for="scn in scenarios"
						:key="scn.key"
						:class="['bm-scenario-badge', { 'bm-scenario-badge--active': activeScenario === scn.key }]"
						@click="activeScenario = scn.key">
						{{ bmt.scenarios[scn.key].label }}
					</button>
				</div>

				<!-- Chart -->
				<div class="bm-chart">
					<p class="bm-chart__note">
						{{ bmt.scenarios[currentScenario.key].notes }}
					</p>

					<TransitionGroup
						name="bm-bar"
						tag="div"
						class="bm-chart__bars">
						<div
							v-for="lib in activeLibNames"
							:key="lib"
							class="bm-bar">
							<div
								:class="['bm-bar__label', { 'bm-bar__label--ours': lib === 'QuickModel' }]"
								:style="{
									color: libraries[lib]?.color,
									background: lib === 'QuickModel' ? libraries[lib]?.color + '22' : 'transparent',
									borderRadius: lib === 'QuickModel' ? '8px' : '0',
									padding: lib === 'QuickModel' ? '2px 10px 2px 8px' : '0',
									border: lib === 'QuickModel' ? '1px solid ' + libraries[lib]?.color + '44' : 'none',
								}">
								{{ lib }}
							</div>
							<div class="bm-bar__track">
								<div
									v-if="!isOverflow(lib)"
									class="bm-bar__fill"
									:style="{ width: barPercent(lib) + '%', background: libraries[lib]?.color }"
									@mouseenter="onBarMouseEnter(lib, $event)"
									@mouseleave="onBarMouseLeave">
									<span class="bm-bar__value">
										{{ formatOps(lib) }}
									</span>
								</div>
								<div
									v-else
									class="bm-bar__overflow"
									:style="{ '--bar-color': libraries[lib]?.color }"
									@mouseenter="onBarMouseEnter(lib, $event)"
									@mouseleave="onBarMouseLeave">
									<div
										class="bm-bar__overflow-fill"
										:style="{ background: libraries[lib]?.color }">
										<span class="bm-bar__value">
											{{ formatOps(lib) }}
										</span>
									</div>
									<div
										class="bm-bar__overflow-ext"
										:style="{ color: libraries[lib]?.color }">
										›› {{ t.benchmark.muchFaster }}
										<span class="bm-bar__overflow-caveat">
											{{ t.benchmark.seeNote }}
										</span>
									</div>
								</div>
							</div>
						</div>
					</TransitionGroup>

					<p
						v-if="excludedLibNames.length > 0"
						class="bm-chart__excluded-note">
						{{ t.benchmark.notApplicable }}:
						<span
							v-for="(exLib, idx) in excludedLibNames"
							:key="exLib"
							:style="{ color: libraries[exLib]?.color }"
							class="bm-chart__excluded-lib">
							{{ exLib
							}}{{
								idx < excludedLibNames.length - 1 ? ', ' : ''
							}}
						</span>
					</p>

					<div class="bm-chart__axis-hint">
						&larr; {{ t.benchmark.slower }}
						&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
						{{ t.benchmark.faster }} &rarr;
					</div>
				</div>
			</template>
		</div>
	</Transition>

	<!-- ═══════════════════════════════════════════════════════
	     TOOLTIPS (always mounted — outside the tab transition)
	     ═══════════════════════════════════════════════════════ -->

	<!-- Warning tooltip -->
	<Teleport to="body">
		<Transition name="bm-fade">
			<div
				v-if="warningTooltipText"
				class="bm-warning-tooltip"
				:style="{ top: warningTooltipY + 'px', left: warningTooltipX + 'px' }">
				{{ warningTooltipText }}
			</div>
		</Transition>
	</Teleport>

	<!-- Hover tooltip -->
	<Teleport to="body">
		<Transition name="bm-fade">
			<div
				v-if="hoveredLib"
				class="bm-tooltip"
				:style="{ top: tooltipY + 'px', left: tooltipX + 'px' }">
				<div
					class="bm-tooltip__header"
					:style="{ background: libraries[hoveredLib]?.color }">
					<span class="bm-tooltip__lib">{{ hoveredLib }}</span>
					<span class="bm-tooltip__desc">
						{{ bmt.libraries[libraries[hoveredLib].i18nKey].desc }}
					</span>
				</div>
				<div class="bm-tooltip__body">
					<div
						v-if="bmt.libraries[libraries[hoveredLib].i18nKey].pros.length"
						class="bm-tooltip__section">
						<div class="bm-tooltip__section-title">
							{{ t.benchmark.tooltipIncludes }}
						</div>
						<ul class="bm-tooltip__list">
							<li
								v-for="pro in bmt.libraries[libraries[hoveredLib].i18nKey].pros"
								:key="pro"
								class="bm-tooltip__pro">
								{{ pro }}
							</li>
						</ul>
					</div>
					<div
						v-if="bmt.libraries[libraries[hoveredLib].i18nKey].cons.length"
						class="bm-tooltip__section">
						<div class="bm-tooltip__section-title">
							{{ t.benchmark.tooltipMissing }}
						</div>
						<ul class="bm-tooltip__list">
							<li
								v-for="con in bmt.libraries[libraries[hoveredLib].i18nKey].cons"
								:key="con"
								class="bm-tooltip__con">
								{{ con }}
							</li>
						</ul>
					</div>
				</div>
			</div>
		</Transition>
	</Teleport>
</div>
